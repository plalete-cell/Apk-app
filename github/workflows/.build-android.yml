name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GLITCH_Lab glitch_lab.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GLITCH_Lab_Windows_EXE
          path: dist/GLITCH_Lab.exe
